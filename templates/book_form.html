{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <hr>

    <form method="POST" action="{{ request.path }}">
        <div class="mb-3">
            <label for="title" class="form-label">العنوان</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ book.title if book else '' }}" required>
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">المؤلف</label>
            <input type="text" class="form-control" id="author" name="author" value="{{ book.author if book else '' }}" required>
        </div>

        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN</label>
            <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book.isbn if book else '' }}" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">السعر</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ book.price if book else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="quantity" class="form-label">الكمية</label>
                <input type="number" class="form-control" id="quantity" name="quantity" value="{{ book.quantity if book else '' }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">حفظ</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">إلغاء</a>
    </form>
{% endblock %}
